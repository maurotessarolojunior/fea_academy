version: 2

models:
  - name: int_sales_joined
    description: "Intermediate model joining sales order detail with sales order header. Grain: one row per sales_order_detail_pk (one line item per order)."
    columns:
      - name: sales_order_detail_pk
        description: "Primary key. One row per order line item."
        tests:
          - unique
          - not_null

      - name: sales_order_pk
        description: "FK to sales order header. Many detail lines per order."
        tests:
          - not_null

      - name: product_fk
        description: "FK to product."
        tests:
          - not_null

      - name: special_offer_fk
        description: "FK to special offer. Nullable."

      - name: order_qty
        description: "Quantity ordered for this line item."
        tests:
          - not_null

      - name: unit_price
        description: "Unit price at time of sale."
        tests:
          - not_null

      - name: unit_price_discount
        description: "Discount applied to unit price."
        tests:
          - not_null

      - name: line_total
        description: "Total for this line item (unit_price * order_quantity * (1 - discount))."
        tests:
          - not_null

      - name: customer_fk
        description: "FK to customer."
        tests:
          - not_null

      - name: credit_card_fk
        description: "FK to credit card. Nullable (some orders may not use credit card)."

      - name: territory_fk
        description: "FK to sales territory. Nullable."

      - name: salesperson_fk
        description: "FK to salesperson. Nullable (online orders may not have a salesperson)."

      - name: ship_to_address_fk
        description: "FK to shipping address."
        tests:
          - not_null

      - name: order_date
        description: "Date the order was placed."
        tests:
          - not_null

      - name: due_date
        description: "Date the order is due."
        tests:
          - not_null

      - name: ship_date
        description: "Date the order was shipped. Nullable (may not be shipped yet)."

      - name: order_status
        description: "Status of the order."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]

      - name: is_online_order
        description: "True if the order was placed online."
        tests:
          - not_null

      - name: subtotal
        description: "Order subtotal before tax and freight."
        tests:
          - not_null

      - name: tax_amount
        description: "Tax amount for the order."
        tests:
          - not_null

      - name: freight
        description: "Freight cost for the order."
        tests:
          - not_null

      - name: total_due
        description: "Total amount due (subtotal + tax + freight)."
        tests:
          - not_null

      - name: last_updated_at
        description: "Timestamp of last update in source system."
        tests:
          - not_null