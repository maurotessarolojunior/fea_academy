version: 2

models:
  - name: dim_customers
    description: "Dimensão de clientes com informações pessoais e de loja."
    columns:
      - name: customer_key
        description: "Surrogate key gerada pelo dbt_utils."
        tests:
          - unique
          - not_null
      - name: customer_pk
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Dimensão de produtos com categoria, subcategoria e modelo."
    columns:
      - name: product_key
        tests:
          - unique
          - not_null
      - name: product_pk
        tests:
          - unique
          - not_null

  - name: dim_locations
    description: "Dimensão de localização: endereço, estado e país."
    columns:
      - name: location_key
        tests:
          - unique
          - not_null
      - name: address_pk
        tests:
          - unique
          - not_null

  - name: dim_salesperson
    description: "Dimensão de vendedores com dados de funcionário e pessoa."
    columns:
      - name: salesperson_key
        tests:
          - unique
          - not_null
      - name: salesperson_pk
        tests:
          - unique
          - not_null


    description: "Dimensão de motivos de venda (ex: Promotion, Price, etc.)."
    columns:
      - name: sales_reason_key
        tests:
          - unique
          - not_null
      - name: sales_reason_pk
        tests:
          - unique
          - not_null


    description: "Dimensão de cartões de crédito usados nas compras."
    columns:
      - name: credit_card_key
        tests:
          - unique
          - not_null
      - name: credit_card_pk
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Dimensão de data com atributos de calendário (2005-2015)."
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
      - name: date_actual
        tests:
          - unique
          - not_null

  - name: fct_sales
    description: "Fato de vendas com grain em nível de linha de pedido (sales_order_detail)."
    columns:
      - name: sales_key
        tests:
          - unique
          - not_null
      - name: sales_order_detail_pk
        tests:
          - unique
          - not_null
      - name: order_qty
        tests:
          - not_null
      - name: line_total
        tests:
          - not_null


    description: "Bridge table para relacionamento N:N entre pedidos e motivos de venda."
    columns:
      - name: bridge_key
        tests:
          - unique
          - not_null