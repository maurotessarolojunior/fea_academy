version: 2

models:
  - name: dim_customers
    description: "Dimensão de clientes com informações pessoais e de loja."
    columns:
      - name: customer_key
        description: "Surrogate key gerada pelo dbt_utils."
        tests:
          - unique
          - not_null
      - name: customer_pk
        description: "Primary key natural do cliente."
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Nome de exibição: nome da loja para Resellers, nome completo para Individuals."
        tests:
          - not_null
      - name: customer_type
        description: "Tipo de cliente: 'Reseller' ou 'Individual'."
        tests:
          - not_null
          - accepted_values:
              values: ['Reseller', 'Individual']

  - name: dim_products
    description: "Dimensão de produtos com categoria, subcategoria e modelo."
    columns:
      - name: product_key
        description: "Surrogate key gerada pelo dbt_utils."
        tests:
          - unique
          - not_null
      - name: product_pk
        description: "Primary key natural do produto."
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Nome do produto."
        tests:
          - not_null
      - name: category_name
        description: "Nome da categoria. 'Uncategorized' para produtos sem categoria."
        tests:
          - not_null
      - name: subcategory_name
        description: "Nome da subcategoria. 'Uncategorized' para produtos sem subcategoria."
        tests:
          - not_null

  - name: dim_locations
    description: "Dimensão de localização: endereço, estado e país."
    columns:
      - name: location_key
        description: "Surrogate key gerada pelo dbt_utils."
        tests:
          - unique
          - not_null
      - name: address_pk
        description: "Primary key natural do endereço."
        tests:
          - unique
          - not_null
      - name: city
        description: "Cidade."
        tests:
          - not_null

  - name: dim_salesperson
    description: "Dimensão de vendedores com dados de funcionário e pessoa."
    columns:
      - name: salesperson_key
        description: "Surrogate key gerada pelo dbt_utils."
        tests:
          - unique
          - not_null
      - name: salesperson_pk
        description: "Primary key natural do vendedor."
        tests:
          - unique
          - not_null
      - name: full_name
        description: "Nome completo do vendedor."
        tests:
          - not_null

  - name: dim_salesreason
    description: "Dimensão de motivos de venda (ex: Promotion, Price, etc.)."
    columns:
      - name: sales_reason_key
        description: "Surrogate key gerada pelo dbt_utils."
        tests:
          - unique
          - not_null
      - name: sales_reason_pk
        description: "Primary key natural do motivo de venda."
        tests:
          - unique
          - not_null
      - name: sales_reason_name
        description: "Nome do motivo de venda."
        tests:
          - not_null

  - name: dim_creditcards
    description: "Dimensão de cartões de crédito usados nas compras."
    columns:
      - name: credit_card_key
        description: "Surrogate key gerada pelo dbt_utils."
        tests:
          - unique
          - not_null
      - name: credit_card_pk
        description: "Primary key natural do cartão."
        tests:
          - unique
          - not_null
      - name: card_type
        description: "Tipo do cartão (ex: Visa, MasterCard)."
        tests:
          - not_null

  - name: dim_date
    description: "Dimensão de data com atributos de calendário (2005-2015)."
    columns:
      - name: date_key
        description: "Surrogate key gerada pelo dbt_utils."
        tests:
          - unique
          - not_null
      - name: date_actual
        description: "Data real no formato DATE."
        tests:
          - unique
          - not_null

  - name: fct_sales
    description: "Fato de vendas com grain em nível de linha de pedido (sales_order_detail)."
    columns:
      - name: sales_key
        description: "Surrogate key gerada pelo dbt_utils."
        tests:
          - unique
          - not_null
      - name: sales_order_detail_pk
        description: "Primary key natural da linha de pedido."
        tests:
          - unique
          - not_null
      - name: order_qty
        description: "Quantidade de itens no pedido."
        tests:
          - not_null
      - name: unit_price
        description: "Preço unitário no momento da venda."
        tests:
          - not_null
      - name: unit_price_discount
        description: "Desconto aplicado ao preço unitário."
        tests:
          - not_null
      - name: gross_sales
        description: "Vendas brutas: order_qty * unit_price (sem desconto)."
        tests:
          - not_null
      - name: net_sales
        description: "Vendas líquidas: order_qty * unit_price * (1 - unit_price_discount)."
        tests:
          - not_null
      - name: line_total
        description: "Valor total da linha vindo da fonte."
        tests:
          - not_null
      - name: order_date
        description: "Data do pedido."
        tests:
          - not_null

  - name: bridge_salesreason
    description: "Bridge table para relacionamento N:N entre pedidos e motivos de venda."
    columns:
      - name: bridge_key
        description: "Surrogate key gerada pelo dbt_utils."
        tests:
          - unique
          - not_null